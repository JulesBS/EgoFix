<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EgoFix - The Corrector</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"SF Mono","Courier New",monospace;gap:10px}
    .lbl{font-size:8px;letter-spacing:4px;color:#1a1a1a}
    .slug{font-size:7px;letter-spacing:2px;color:#0e0e0e}
    #loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:4px;color:#333;z-index:100;transition:opacity .8s}
  </style>
</head>
<body>
<div id="loading">LOADING...</div>
<div class="lbl">THE CORRECTOR</div>
<div class="slug">// need-to-be-right</div>
<canvas id="c" width="340" height="340"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const CW=5,CH=9,CHARS=" `.',-~:;!=+*%&#@MW",MODEL_SCALE=1/20.68,HEAD_WY=0.90,W=340,H=340;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.textBaseline='top';
const bloomCv=document.createElement('canvas');
bloomCv.width=W;bloomCv.height=H;
const bloomCtx=bloomCv.getContext('2d');
bloomCtx.textBaseline='top';
const cols=Math.floor(W/CW),rows=Math.floor(H/CH),pix=new Uint8Array(W*H*4);
const r3=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r3.setSize(W,H);r3.setPixelRatio(1);r3.setClearColor(0,1);
r3.shadowMap.enabled=true;r3.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(22,1,0.001,50);
camera.position.set(0,0.88,1.1);camera.lookAt(0,0.84,0);
const bl=new THREE.DirectionalLight(0xffffff,1.0);
bl.position.set(-4.05,5.95,-1.60);bl.castShadow=true;
bl.shadow.mapSize.set(2048,2048);bl.shadow.camera.near=0.1;bl.shadow.camera.far=30;bl.shadow.bias=-0.001;
scene.add(bl);scene.add(new THREE.AmbientLight(0xffffff,0.05));

const cubeData=Array.from({length:7},(_,i)=>{
  const size=0.028+(i%3)*0.010;
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(size,size,size),
    new THREE.MeshPhongMaterial({color:0xc8c8c8,specular:0xffffff,shininess:26,emissive:0x000000})
  );
  mesh.castShadow=mesh.receiveShadow=true;
  scene.add(mesh);
  const light=new THREE.PointLight(0x000000,0,0.3);
  light.decay=2;
  scene.add(light);
  return{mesh,light,angle:(i/7)*Math.PI*2,radius:0.22+(i%3)*0.06,yOff:(i%4-1.5)*0.09,
    orbitSpeed:(i%2===0?1:-1)*(0.35+(i%5)*0.08),
    sx:0.4+(i*0.17)%1.0,sy:0.3+(i*0.23)%1.0,sz:0.2+(i*0.31)%0.8,
    // flicker state machine: off -> flickering_on -> on -> flickering_off -> off
    state:'off', stateTimer: 1.0 + Math.random() * 3.0,
    targetColor:0, flickerClock:0,
    // split animation data
    columnIndex:i, orbitPos:new THREE.Vector3(), columnPos:new THREE.Vector3(), orbitScale:0,
    orbitRot:new THREE.Euler()};
});

let fig=null,t=0,prev=performance.now();
let meshL=null,meshR=null;
let animState='orbit',animT=0,splitFraction=0;
let splitFacingY=0,splitStartY=0;

// Split animation constants
const SPLIT_OFFSET=0.085;
const SPLIT_DURATION=2.0;
const COLUMN_Y_TOP=0.95;
const COLUMN_Y_BOTTOM=0.72;
const COLUMN_CUBE_SIZE=0.033;
const COLUMN_GAP=0.012;

function smoothstep(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}

function columnTargetY(i){
  const total=7*COLUMN_CUBE_SIZE+6*COLUMN_GAP;
  const startY=COLUMN_Y_BOTTOM+(COLUMN_Y_TOP-COLUMN_Y_BOTTOM-total)/2;
  return startY+i*(COLUMN_CUBE_SIZE+COLUMN_GAP)+COLUMN_CUBE_SIZE/2;
}

function updateSplit(frac){
  if(!meshL||!meshR)return;
  meshL.position.x=-frac*SPLIT_OFFSET;
  meshR.position.x= frac*SPLIT_OFFSET;
}

cv.addEventListener('click',()=>{
  if(!fig)return;
  if(animState==='orbit'){
    animState='splitting';animT=0;
    // snapshot current rotation and find nearest front-facing angle
    splitStartY=fig.rotation.y;
    splitFacingY=Math.round(splitStartY/(Math.PI*2))*Math.PI*2;
    for(const c of cubeData){c.orbitPos.copy(c.mesh.position);c.orbitScale=c.mesh.scale.x;c.orbitRot.copy(c.mesh.rotation);}
  }else if(animState==='split'){
    animState='merging';animT=0;
    for(const c of cubeData){c.columnPos.copy(c.mesh.position);c.sx=0.3+Math.random()*0.7;c.sy=0.3+Math.random()*0.7;c.sz=0.2+Math.random()*0.6;}
  }
});

// Status colors: 0=white, 1=green, 2=red
const CUBE_COLORS=[0xc8c8c8,0x00ff00,0xff0000];
const CUBE_SPECS =[0xffffff,0xffffff,0xffffff];
const CUBE_EMISSIVE=[0x000000,0x00aa00,0xaa0000];

function draw(){
  r3.render(scene,camera);
  const gl=r3.getContext();
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,pix);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.font=CH+'px "SF Mono","Courier New",monospace';
  bloomCtx.clearRect(0,0,W,H);
  bloomCtx.font=CH+'px "SF Mono","Courier New",monospace';
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const sx=Math.floor((col+0.5)*CW),sy=Math.floor((row+0.5)*CH);
      const idx=((H-1-sy)*W+sx)*4;
      const a=pix[idx+3]/255;
      const lum=a*(0.299*pix[idx]+0.587*pix[idx+1]+0.114*pix[idx+2])/255;
      if(lum<0.005)continue;
      const ch=CHARS[Math.floor(Math.min(0.9999,lum)*CHARS.length)];
      if(ch===' ')continue;
      const cr=Math.round(Math.min(255,Math.pow(pix[idx  ]*a/255,0.27)*255*1.5));
      const cg=Math.round(Math.min(255,Math.pow(pix[idx+1]*a/255,0.27)*255*1.5));
      const cb=Math.round(Math.min(255,Math.pow(pix[idx+2]*a/255,0.27)*255*1.5));
      const color='rgb('+cr+','+cg+','+cb+')';
      ctx.fillStyle=color;
      ctx.fillText(ch,col*CW,row*CH);
      // collect colored (non-gray) cells for bloom
      const maxC=Math.max(cr,cg,cb),minC=Math.min(cr,cg,cb);
      if(maxC>0&&(maxC-minC)/maxC>0.2){
        bloomCtx.fillStyle=color;
        bloomCtx.fillText(ch,col*CW,row*CH);
      }
    }
  }
  // bloom composite — layered blurs for soft glow
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.filter='blur(2px)';ctx.globalAlpha=0.6;
  ctx.drawImage(bloomCv,0,0);
  ctx.filter='blur(6px)';ctx.globalAlpha=0.35;
  ctx.drawImage(bloomCv,0,0);
  ctx.filter='blur(14px)';ctx.globalAlpha=0.18;
  ctx.drawImage(bloomCv,0,0);
  ctx.restore();
}

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-prev)/1000,0.05);prev=now;t+=dt;
  if(!fig)return;

  // Animation state progression
  if(animState==='splitting'){
    animT=Math.min(animT+dt/SPLIT_DURATION,1);
    splitFraction=smoothstep(animT);
    if(animT>=1)animState='split';
  }else if(animState==='split'){
    splitFraction=1;
  }else if(animState==='merging'){
    animT=Math.min(animT+dt/SPLIT_DURATION,1);
    splitFraction=smoothstep(1-animT);
    if(animT>=1){animState='orbit';splitFraction=0;}
  }else{
    splitFraction=0;
  }

  // Figure rotation: orbit freely, lerp to front-facing in sync with split
  if(animState==='orbit'){
    fig.rotation.y+=dt*0.25;
  }else if(animState==='splitting'){
    fig.rotation.y=splitStartY*(1-splitFraction)+splitFacingY*splitFraction;
  }else if(animState==='split'){
    fig.rotation.y=splitFacingY;
  }else if(animState==='merging'){
    // splitFraction goes 1→0, so rotation goes splitFacingY → resume spinning
    fig.rotation.y=splitFacingY;
    fig.rotation.y+=dt*0.25*(1-splitFraction);
    splitStartY=fig.rotation.y; // update for smooth handoff to orbit
  }

  // Update split position
  updateSplit(splitFraction);

  for(const c of cubeData){
    // Cube positioning depends on animation state
    if(splitFraction<0.001){
      // ORBIT: normal orbital motion
      c.angle+=c.orbitSpeed*dt;
      const ang=c.angle+fig.rotation.y;
      c.mesh.position.set(Math.cos(ang)*c.radius,HEAD_WY+c.yOff,Math.sin(ang)*c.radius);
      c.mesh.rotation.x+=c.sx*dt;c.mesh.rotation.y+=c.sy*dt;c.mesh.rotation.z+=c.sz*dt;
    }else if(animState==='splitting'||animState==='split'){
      // SPLITTING/SPLIT: lerp from orbit snapshot to column target
      const ty=columnTargetY(c.columnIndex);
      const target=new THREE.Vector3(0,ty,0);
      c.mesh.position.lerpVectors(c.orbitPos,target,splitFraction);
      // Scale: lerp from orbit scale to target scale (COLUMN_CUBE_SIZE / geoSize)
      const geoSize=0.028+(c.columnIndex%3)*0.010;
      const targetScale=COLUMN_CUBE_SIZE/geoSize;
      c.mesh.scale.setScalar(c.orbitScale*(1-splitFraction)+targetScale*splitFraction);
      // Lerp rotation toward straight (0,0,0)
      c.mesh.rotation.x=c.orbitRot.x*(1-splitFraction);
      c.mesh.rotation.y=c.orbitRot.y*(1-splitFraction);
      c.mesh.rotation.z=c.orbitRot.z*(1-splitFraction);
    }else if(animState==='merging'){
      // MERGING: lerp from column snapshot toward live orbit position
      c.angle+=c.orbitSpeed*dt;
      const ang=c.angle+fig.rotation.y;
      const orbitTarget=new THREE.Vector3(Math.cos(ang)*c.radius,HEAD_WY+c.yOff,Math.sin(ang)*c.radius);
      c.mesh.position.lerpVectors(orbitTarget,c.columnPos,splitFraction);
      // Scale back to orbit scale (1.0)
      const geoSize=0.028+(c.columnIndex%3)*0.010;
      const targetScale=COLUMN_CUBE_SIZE/geoSize;
      c.mesh.scale.setScalar(targetScale*splitFraction+1.0*(1-splitFraction));
      const mf=1-splitFraction;
      c.mesh.rotation.x+=c.sx*dt*mf;c.mesh.rotation.y+=c.sy*dt*mf;c.mesh.rotation.z+=c.sz*dt*mf;
    }

    // Flicker state machine (runs in all states)
    c.stateTimer-=dt;
    c.flickerClock+=dt;
    switch(c.state){
      case 'off':
        if(c.stateTimer<=0){
          c.targetColor=1+Math.floor(Math.random()*2);
          c.state='flickering_on';
          c.stateTimer=0.15+Math.random()*0.2;
          c.flickerClock=0;
        }
        break;
      case 'flickering_on':{
        const on=Math.sin(c.flickerClock*55)>0;
        const ci=on?c.targetColor:0;
        c.mesh.material.color.setHex(CUBE_COLORS[ci]);
        c.mesh.material.specular.setHex(CUBE_SPECS[ci]);
        c.mesh.material.emissive.setHex(CUBE_EMISSIVE[ci]);
        c.light.color.setHex(ci?CUBE_COLORS[ci]:0x000000);
        c.light.intensity=ci?0.35:0;
        if(c.stateTimer<=0){
          c.state='on';
          c.stateTimer=2.0+Math.random()*4.0;
          c.mesh.material.color.setHex(CUBE_COLORS[c.targetColor]);
          c.mesh.material.specular.setHex(CUBE_SPECS[c.targetColor]);
          c.mesh.material.emissive.setHex(CUBE_EMISSIVE[c.targetColor]);
          c.light.color.setHex(CUBE_COLORS[c.targetColor]);
          c.light.intensity=0.35;
        }
        break;}
      case 'on':
        if(c.stateTimer<=0){
          c.state='flickering_off';
          c.stateTimer=0.15+Math.random()*0.2;
          c.flickerClock=0;
        }
        break;
      case 'flickering_off':{
        const on=Math.sin(c.flickerClock*55)>0;
        const ci=on?c.targetColor:0;
        c.mesh.material.color.setHex(CUBE_COLORS[ci]);
        c.mesh.material.specular.setHex(CUBE_SPECS[ci]);
        c.mesh.material.emissive.setHex(CUBE_EMISSIVE[ci]);
        c.light.color.setHex(ci?CUBE_COLORS[ci]:0x000000);
        c.light.intensity=ci?0.35:0;
        if(c.stateTimer<=0){
          c.state='off';
          c.stateTimer=1.5+Math.random()*4.0;
          c.mesh.material.color.setHex(CUBE_COLORS[0]);
          c.mesh.material.specular.setHex(CUBE_SPECS[0]);
          c.mesh.material.emissive.setHex(0x000000);
          c.light.intensity=0;
        }
        break;}
    }
    c.light.position.copy(c.mesh.position);
  }
  draw();
}

const loader=new THREE.GLTFLoader();
let loadCount=0;
function onHalfLoaded(gltf,side){
  let geo=null;
  gltf.scene.traverse(c=>{if(c.isMesh&&!geo)geo=c.geometry;});
  if(!geo.attributes.normal)geo.computeVertexNormals();
  const mat=new THREE.MeshPhongMaterial({color:0xc8c8c8,specular:0xffffff,shininess:26,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.castShadow=mesh.receiveShadow=true;mesh.scale.setScalar(MODEL_SCALE);
  if(side==='left'){meshL=mesh;}else{meshR=mesh;}
  loadCount++;
  if(loadCount===2){
    fig=new THREE.Group();fig.add(meshL);fig.add(meshR);scene.add(fig);
    document.getElementById('loading').style.opacity='0';
    setTimeout(()=>document.getElementById('loading').style.display='none',800);
    requestAnimationFrame(loop);
  }
}
loader.load('FinalBaseMesh_left.glb',g=>onHalfLoaded(g,'left'));
loader.load('FinalBaseMesh_right.glb',g=>onHalfLoaded(g,'right'));
</script>
</body>
</html>
